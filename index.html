<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>烏克麗麗小島</title>
<meta name="theme-color" content="#ffe9b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="烏克麗麗">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#fff6df;--ink:#3b2f2f;--soft:#8a7768;--card:#fff;--line:#ecdcbc;--go:#35b56a;--go-d:#23894d;--warn:#d9822b;--bad:#c9453c;--blue:#3d7fe0;
  --r:28px;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:active{transform:scale(.95)}
.top{display:flex;justify-content:space-between;align-items:center;min-height:64px}
.round{width:64px;height:64px;border-radius:50%;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:32px;display:grid;place-items:center}
.gear{width:48px;height:48px;font-size:22px;opacity:.55}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
.logo{font-size:84px;line-height:1}
.kids{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
.kid{width:min(40vw,240px);aspect-ratio:1;border-radius:var(--r);box-shadow:0 8px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.kid .face{font-size:min(20vw,120px);line-height:1.1}
.kid .nm{font-size:22px;font-weight:700}
.big{font-size:min(34vw,200px);line-height:1}
.play{width:min(46vw,240px);aspect-ratio:1;border-radius:50%;background:var(--go);box-shadow:0 12px 0 var(--go-d);display:grid;place-items:center}
.play:active{box-shadow:0 4px 0 var(--go-d);transform:translateY(8px)}
.play svg{width:46%;margin-left:8%}
.dots{display:flex;gap:18px}
.dot{width:44px;height:44px;border-radius:50%;background:#e9dcc3;display:grid;place-items:center;font-size:26px;transition:.2s}
.dot.on{background:#ffd23f;transform:scale(1.2)}
.star{font-size:min(40vw,220px);line-height:1;margin:40px 0 56px;transition:transform .08s,filter .08s;filter:grayscale(.7) opacity(.6)}
.hint{font-size:18px;color:var(--soft);max-width:520px;line-height:1.6;-webkit-user-select:text;user-select:text}
.bounce{animation:b 1s infinite}@keyframes b{50%{transform:translateY(-14px)}}
.pop{animation:p .5s}@keyframes p{0%{transform:scale(.3)}70%{transform:scale(1.15)}}
/* 家長模式 */
.parent{max-width:720px;width:100%;margin:0 auto;-webkit-user-select:text;user-select:text}
.parent h1{font-size:26px;margin:0}
.parent h2{font-size:19px;margin:26px 0 10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--blue);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;font-size:17px}
.btn.ghost{background:#f1e7d0;color:var(--ink)}.btn.danger{background:var(--bad)}.btn.sm{padding:8px 12px;font-size:15px}
input[type=text]{font:inherit;font-size:19px;padding:12px;border:2px solid var(--line);border-radius:12px;width:100%;background:#fffdf7;-webkit-user-select:text;user-select:text}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.chk:last-child{border:0}
.chk .ic{font-size:22px;width:28px;text-align:center}.chk b{display:block}.chk small,.small{color:var(--soft);font-size:15px;line-height:1.5}
.pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.pick button{font-size:34px;aspect-ratio:1;border-radius:14px;background:#f6edd9;border:3px solid transparent}
.pick button.sel{border-color:var(--blue);background:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:10px 14px;border-radius:12px;background:#f1e7d0;font-size:17px;font-weight:600;min-width:48px}
.seg button.sel{background:var(--blue);color:#fff}
.krow{display:flex;align-items:center;gap:12px;padding:8px 0}.krow .f{font-size:38px;width:56px;height:56px;border-radius:14px;display:grid;place-items:center}.krow .n{flex:1;font-size:19px;font-weight:700}
.gate{font-size:44px;font-weight:800;letter-spacing:2px}
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:12px}
.pad button{height:72px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:30px;font-weight:700}
.banner{background:#fff1d6;border:2px solid var(--warn);border-radius:18px;padding:14px 16px;font-size:16px;line-height:1.6;text-align:left;max-width:560px;-webkit-user-select:text;user-select:text}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#3b2f2f;color:#fff;padding:12px 20px;border-radius:99px;font-size:16px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
'use strict';
const VERSION='0.1.0';
const KEY='ukulele_kids_v1';
/* 頭像刻意避開弦的動物（狗、貓、魚、青蛙）和節奏動物（大象、兔子、烏龜），以免小朋友混淆 */
const ANIMALS=['🦁','🐼','🐨','🐵','🦊','🐯','🐧','🦄','🐻','🦉','🐷','🐮'];
const TINTS=['#ffd6e0','#d9e8ff','#e3d9ff','#ffe2c4','#d5f2e3','#fff0b3'];
const DAYS=['日','一','二','三','四','五','六'];
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 資料：只存在這台裝置 ---------- */
let memOnly=false;
const fresh=()=>({v:1,kids:[],settings:{classDay:null,minutes:15,split:false},meta:{createdAt:new Date().toISOString(),updatedAt:null,lastExport:null,micOk:null}});
function normalize(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.kids))return null;
  const o=fresh();
  o.kids=d.kids.filter(k=>k&&typeof k.id==='string').slice(0,6).map((k,i)=>({id:k.id,name:String(k.name||'').slice(0,12),animal:ANIMALS.includes(k.animal)?k.animal:ANIMALS[i],tint:TINTS.includes(k.tint)?k.tint:TINTS[i%TINTS.length],createdAt:k.createdAt||new Date().toISOString()}));
  const s=d.settings||{};
  o.settings.classDay=Number.isInteger(s.classDay)&&s.classDay>=0&&s.classDay<=6?s.classDay:null;
  o.settings.minutes=[10,15].includes(s.minutes)?s.minutes:15;
  o.settings.split=!!s.split;
  Object.assign(o.meta,d.meta&&typeof d.meta==='object'?d.meta:{});
  return o;
}
function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY)))||fresh()}catch(e){memOnly=true;return fresh()}}
let DB=load();
function save(){DB.meta.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){memOnly=true}}
let persisted=null;
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(p=>{persisted=p}).catch(()=>{});

/* ---------- 環境 ---------- */
const standalone=()=>window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const secure=()=>window.isSecureContext;

/* ---------- 聲音與語音 ---------- */
let AC=null;
function audio(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(freqs=[784,1047],gap=.11){try{const ac=audio();freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*gap;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.45)})}catch(e){}}
let VOICE=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices();VOICE=v.find(x=>/zh[-_]TW/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';if(VOICE)u.voice=VOICE;u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- 麥克風 ---------- */
let MIC=null;
async function micStart(onLevel){
  micStop();
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const ac=audio(),src=ac.createMediaStreamSource(stream),an=ac.createAnalyser();an.fftSize=1024;src.connect(an);
  const buf=new Float32Array(an.fftSize);let raf=0,prev=0,last=0;
  const tick=()=>{an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];const rms=Math.sqrt(s/buf.length);
    const now=performance.now();const hit=rms>.05&&rms>prev*1.6&&now-last>300;if(hit)last=now;prev=prev*.7+rms*.3;onLevel(rms,hit);raf=requestAnimationFrame(tick)};
  tick();
  MIC={stop(){cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop());try{src.disconnect()}catch(e){}}};
}
function micStop(){if(MIC){MIC.stop();MIC=null}}

/* ---------- 畫面切換 ---------- */
let VIEW='home',ARG=null;
function go(v,a){micStop();if('speechSynthesis' in window)speechSynthesis.cancel();VIEW=v;ARG=a===undefined?null:a;render();window.scrollTo(0,0)}
function render(){({home:vHome,kid:vKid,sound:vSound,soon:vSoon,gate:vGate,parent:vParent,edit:vEdit}[VIEW]||vHome)()}
const kidOf=id=>DB.kids.find(k=>k.id===id);

/* 首頁：選頭像 */
function vHome(){
  const needInstall=isIOS()&&!standalone();
  $.innerHTML=`<div class="top"><span></span><button class="round gear" id="pg" aria-label="家長模式">⚙️</button></div>
  <div class="mid"><div class="logo">🎶🏝️</div>
  ${DB.kids.length?`<div class="kids">${DB.kids.map(k=>`<button class="kid" data-id="${k.id}" style="background:${k.tint}"><span class="face">${k.animal}</span><span class="nm">${esc(k.name)}</span></button>`).join('')}</div>`
    :`<div class="banner"><b>給家長：</b>還沒有小朋友的資料。請點右上角的 ⚙️ 進入家長模式，新增小朋友並選一個動物頭像。</div>`}
  ${needInstall?`<div class="banner"><b>給家長：</b>請先把這個網頁加到主畫面再開始設定。<br>在 Safari 按分享按鈕 <b>⬆️</b>，選「<b>加入主畫面</b>」，之後都從主畫面的圖示打開。<br>在 Safari 裡建立的資料<b>不會</b>帶到主畫面的 App 裡。</div>`:''}
  </div>`;
  document.getElementById('pg').onclick=()=>go('gate');
  $.querySelectorAll('.kid').forEach(b=>b.onclick=()=>{ding();go('kid',b.dataset.id)});
}

/* 小朋友首頁：一個大大的開始 */
function vKid(){
  const k=kidOf(ARG);if(!k)return go('home');
  $.innerHTML=`<div class="top"><button class="round" id="bk" aria-label="回首頁">🏠</button><span></span></div>
  <div class="mid"><div class="big pop">${k.animal}</div>
  <button class="play bounce" id="st" aria-label="開始"><svg viewBox="0 0 100 100"><path d="M18 8 L92 50 L18 92 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/></svg></button></div>`;
  document.getElementById('bk').onclick=()=>go('home');
  document.getElementById('st').onclick=()=>{audio();ding([523,659,784]);say(`嗨，${k.name||'小朋友'}！拿好你的烏克麗麗，刷刷看，把星星點亮！`);go2sound(k.id)};
}
function go2sound(id){micStop();VIEW='sound';ARG=id;render()} /* 不經過 go()，避免把剛開始的語音取消 */

/* 聲音測試：刷三下，把星星點亮（同時完成麥克風授權） */
function vSound(){
  const k=kidOf(ARG);if(!k)return go('home');
  $.innerHTML=`<div class="top"><button class="round" id="bk" aria-label="回上一頁">⬅️</button><span></span></div>
  <div class="mid"><div class="star" id="star">⭐</div><div class="dots">${[0,1,2].map(i=>`<div class="dot" id="d${i}"></div>`).join('')}</div><div id="msg"></div></div>`;
  document.getElementById('bk').onclick=()=>go('kid',k.id);
  const star=document.getElementById('star'),msg=document.getElementById('msg');let hits=0,done=false;
  const fail=why=>{DB.meta.micOk=false;save();star.textContent='🎤';msg.innerHTML=`<div class="banner"><b>給家長：</b>${why}</div><p><button class="btn" id="sk">先跳過</button></p>`;document.getElementById('sk').onclick=()=>go('soon',k.id)};
  if(!secure()||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return fail('這個網址不能使用麥克風。請用 <b>https://</b> 開頭的網址打開。');
  micStart((rms,hit)=>{
    if(done)return;const lv=Math.min(1,rms*9);
    star.style.transform=`scale(${1+lv*.35})`;star.style.filter=`grayscale(${Math.max(0,.7-lv*1.2)}) opacity(${.6+lv*.4})`;
    if(hit&&hits<3){document.getElementById('d'+hits).classList.add('on');document.getElementById('d'+hits).textContent='🎵';hits++;ding([660+hits*110],0);
      if(hits===3){done=true;star.style.filter='none';star.style.transform='scale(1.3)';star.classList.add('pop');ding([523,659,784,1047]);say('好棒！星星亮起來了！');setTimeout(()=>{if(VIEW==='sound')go('soon',k.id)},2600)}}
  }).then(()=>{DB.meta.micOk=true;save()}).catch(()=>fail('沒有取得麥克風權限。請在跳出的視窗選「<b>允許</b>」；如果沒有跳出視窗，請到 iPad 的「設定 → Safari → 麥克風」改成「允許」。'));
}

/* 練習內容尚未完成的提示 */
function vSoon(){
  const k=kidOf(ARG);if(!k)return go('home');
  $.innerHTML=`<div class="top"><button class="round" id="bk" aria-label="回首頁">🏠</button><span></span></div>
  <div class="mid"><div class="big">🏝️</div><div style="font-size:64px">🚧 ${k.animal} 🚧</div><button class="round" id="sp" aria-label="再聽一次">🔊</button>
  <p class="hint">給家長：每日練習的內容（暖身、節奏、和弦）還在製作中，完成後這裡會直接開始 ${DB.settings.minutes} 分鐘的練習。</p></div>`;
  const t='練習的小島快要蓋好了，我們下次再來玩！';
  document.getElementById('bk').onclick=()=>go('home');document.getElementById('sp').onclick=()=>say(t);say(t);
}

/* 家長閘門：一題加法 */
function vGate(){
  const a=6+Math.floor(Math.random()*4),b=4+Math.floor(Math.random()*5),ans=String(a+b);let typed='';
  $.innerHTML=`<div class="top"><button class="round" id="bk" aria-label="回首頁">🏠</button><span></span></div>
  <div class="mid"><div class="hint">家長請回答，才能進入家長模式</div><div class="gate">${a} + ${b} = <span id="in">？</span></div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9,'⌫',0,''].map(n=>n===''?'<span></span>':`<button data-n="${n}">${n}</button>`).join('')}</div></div>`;
  document.getElementById('bk').onclick=()=>go('home');const out=document.getElementById('in');
  $.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{const n=b.dataset.n;typed=n==='⌫'?typed.slice(0,-1):(typed+n).slice(0,2);out.textContent=typed||'？';
    if(typed.length===ans.length){if(typed===ans)go('parent');else{typed='';setTimeout(()=>{out.textContent='？'},350)}}});
}

/* 家長模式 */
function checks(){
  const c=[];
  c.push(secure()?['✅','安全連線（https）','可以使用麥克風。']:['⚠️','不是安全連線','目前的網址不是 https，麥克風無法使用。']);
  if(standalone())c.push(['✅','已從主畫面開啟','資料會保存在這個 App 裡。']);
  else if(isIOS())c.push(['⚠️','尚未加入主畫面','在 Safari 按分享按鈕 ⬆️，選「加入主畫面」，之後都從主畫面的圖示打開。現在在 Safari 建立的資料不會帶過去，建議加入主畫面後再新增小朋友。']);
  else c.push(['ℹ️','目前是在瀏覽器裡開啟','在 iPad 上請加入主畫面使用。電腦上可以直接用。']);
  c.push(memOnly?['⚠️','這個瀏覽器無法儲存資料','可能是私密瀏覽模式。關閉後資料會消失。']:persisted?['✅','資料保存','瀏覽器已同意長期保存資料。']:['ℹ️','資料保存','資料存在這台裝置裡。請定期用下方的「備份」匯出。']);
  c.push(DB.meta.micOk===true?['✅','麥克風','上次測試成功。iPad 每次開啟 App 可能會再問一次，請選「允許」。']:DB.meta.micOk===false?['⚠️','麥克風','上次測試失敗。請按「測試麥克風」再試一次。']:['⬜','麥克風','還沒測試過。']);
  c.push(!('speechSynthesis' in window)?['⚠️','語音','這個瀏覽器不支援語音朗讀。']:VOICE?['✅','中文語音',`使用「${esc(VOICE.name)}」。`]:['⬜','中文語音','還沒找到中文語音，請按「試聽語音」確認聽得到。']);
  c.push(DB.kids.length?['✅','小朋友資料',`已建立 ${DB.kids.length} 位。`]:['⬜','小朋友資料','請在下方新增。']);
  c.push(DB.settings.classDay!==null?['✅','上課日',`每週${DAYS[DB.settings.classDay]}。`]:['⬜','上課日','請在下方選擇每週上課是星期幾。']);
  return c;
}
function vParent(){
  const s=DB.settings,le=DB.meta.lastExport;
  $.innerHTML=`<div class="parent"><div class="top"><h1>家長模式</h1><button class="btn ghost" id="bk">回小朋友畫面</button></div>
  <h2>設定檢查</h2><div class="card">${checks().map(c=>`<div class="chk"><span class="ic">${c[0]}</span><div><b>${c[1]}</b><small>${c[2]}</small></div></div>`).join('')}
   <div class="row" style="margin-top:12px"><button class="btn sm" id="tm">測試麥克風</button><button class="btn sm" id="tv">試聽語音</button><span class="small" id="tr"></span></div></div>
  <h2>小朋友</h2><div class="card">${DB.kids.map(k=>`<div class="krow"><span class="f" style="background:${k.tint}">${k.animal}</span><span class="n">${esc(k.name)||'（未命名）'}</span><button class="btn ghost sm" data-e="${k.id}">修改</button></div>`).join('')||'<p class="small" style="margin:0 0 10px">還沒有小朋友。</p>'}
   ${DB.kids.length<6?'<button class="btn" id="add" style="margin-top:8px">新增小朋友</button>':''}</div>
  <h2>每週上課日</h2><div class="card"><div class="seg" id="cd">${DAYS.map((d,i)=>`<button data-d="${i}" class="${s.classDay===i?'sel':''}">${d}</button>`).join('')}<button data-d="x" class="${s.classDay===null?'sel':''}">沒有固定</button></div>
   <p class="small" style="margin:10px 0 0">之後每日練習的內容會依上課日安排：上課後複習新內容，上課前把歌完整彈一遍。</p></div>
  <h2>每天練習多久</h2><div class="card"><div class="seg" id="mn"><button data-m="10" class="${s.minutes===10&&!s.split?'sel':''}">10 分鐘</button><button data-m="15" class="${s.minutes===15&&!s.split?'sel':''}">15 分鐘</button><button data-m="s" class="${s.split?'sel':''}">早晚各 7 分鐘</button></div></div>
  <h2>備份</h2><div class="card"><p class="small" style="margin-top:0">資料只存在這台裝置，不會上傳。請定期匯出，存到「檔案」App 或 iCloud。${le?`<br>上次匯出：${le.slice(0,10)}`:'<br>還沒有匯出過。'}</p>
   <div class="row"><button class="btn" id="ex">匯出備份</button><button class="btn ghost" id="im">從備份還原</button><input type="file" id="fi" accept="application/json,.json" hidden></div></div>
  <p class="small" style="text-align:center">版本 ${VERSION}　<a href="#" id="up">檢查更新</a></p></div>`;
  const b=id=>document.getElementById(id);
  b('bk').onclick=()=>go('home');
  if(b('add'))b('add').onclick=()=>go('edit',null);
  $.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>go('edit',x.dataset.e));
  b('cd').querySelectorAll('button').forEach(x=>x.onclick=()=>{DB.settings.classDay=x.dataset.d==='x'?null:+x.dataset.d;save();vParent()});
  b('mn').querySelectorAll('button').forEach(x=>x.onclick=()=>{if(x.dataset.m==='s'){DB.settings.split=true;DB.settings.minutes=15}else{DB.settings.split=false;DB.settings.minutes=+x.dataset.m}save();vParent()});
  b('tv').onclick=()=>{audio();ding();say('你好，我是烏克麗麗小島，我們一起來練習吧！');b('tr').textContent='有聽到「叮」和中文語音嗎？沒有的話請檢查靜音開關和音量。'};
  b('tm').onclick=async()=>{audio();b('tr').textContent='請對著 iPad 說話或刷一下琴…';let mx=0;
    try{await micStart(r=>{mx=Math.max(mx,r)});setTimeout(()=>{micStop();DB.meta.micOk=mx>.01;save();vParent();toast(mx>.01?'麥克風正常':'沒有收到聲音，請再試一次')},3000)}
    catch(e){DB.meta.micOk=false;save();vParent();toast('沒有取得麥克風權限')}};
  b('ex').onclick=exportData;b('im').onclick=()=>b('fi').click();
  b('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let d=null;try{d=normalize(JSON.parse(r.result))}catch(err){}
    if(!d)return toast('這不是有效的備份檔');if(confirm(`備份裡有 ${d.kids.length} 位小朋友的資料。\n還原後會取代目前的資料，確定嗎？`)){DB=d;save();vParent();toast('已還原')}};r.readAsText(f);e.target.value=''};
  b('up').onclick=async e=>{e.preventDefault();try{const r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}catch(err){}location.reload()};
}
async function exportData(){
  DB.meta.lastExport=new Date().toISOString();save();
  const name=`ukulele-backup-${DB.meta.lastExport.slice(0,10)}.json`,text=JSON.stringify(DB,null,1);
  try{const f=new File([text],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});vParent();return}}catch(e){if(e&&e.name==='AbortError'){vParent();return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();vParent();toast('已匯出');
}

/* 新增／修改小朋友 */
function vEdit(){
  const cur=ARG?kidOf(ARG):null,used=DB.kids.filter(k=>!cur||k.id!==cur.id).map(k=>k.animal);
  let animal=cur?cur.animal:ANIMALS.find(a=>!used.includes(a));
  $.innerHTML=`<div class="parent"><div class="top"><h1>${cur?'修改小朋友':'新增小朋友'}</h1><button class="btn ghost" id="bk">取消</button></div>
  <h2>名字或小名</h2><input type="text" id="nm" maxlength="12" value="${cur?esc(cur.name):''}" placeholder="例如：小安" autocomplete="off">
  <p class="small">名字只存在這台裝置，用來讓語音打招呼。</p>
  <h2>選一個動物頭像</h2><p class="small" style="margin:0">小朋友點自己的動物就能進入。已經被選走的動物不能重複。</p>
  <div class="pick" id="pk">${ANIMALS.map(a=>`<button data-a="${a}" class="${a===animal?'sel':''}" ${used.includes(a)?'disabled style="opacity:.25"':''}>${a}</button>`).join('')}</div>
  <div class="row" style="margin-top:18px"><button class="btn" id="sv">儲存</button>${cur?'<button class="btn danger" id="dl">刪除這位小朋友</button>':''}</div></div>`;
  const b=id=>document.getElementById(id);
  b('bk').onclick=()=>go('parent');
  b('pk').querySelectorAll('button:not([disabled])').forEach(x=>x.onclick=()=>{animal=x.dataset.a;b('pk').querySelectorAll('button').forEach(y=>y.classList.toggle('sel',y===x))});
  b('sv').onclick=()=>{const name=b('nm').value.trim().slice(0,12);if(!name){toast('請輸入名字或小名');return}
    if(cur){cur.name=name;cur.animal=animal}else{const tint=TINTS.find(t=>!DB.kids.some(k=>k.tint===t))||TINTS[DB.kids.length%TINTS.length];DB.kids.push({id:'k'+Date.now().toString(36),name,animal,tint,createdAt:new Date().toISOString()})}
    save();go('parent')};
  if(cur)b('dl').onclick=()=>{if(confirm(`確定刪除「${cur.name}」嗎？這位小朋友的紀錄會一起刪除，無法復原。`)){DB.kids=DB.kids.filter(k=>k.id!==cur.id);save();go('parent')}};
}

document.addEventListener('visibilitychange',()=>{if(document.hidden){micStop();if('speechSynthesis' in window)speechSynthesis.cancel();if(VIEW==='sound')go('kid',ARG)}});
if('serviceWorker' in navigator&&secure())navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
