<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>烏克麗麗小島</title>
<meta name="theme-color" content="#ffe9b8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="烏克麗麗">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#fff6df;--ink:#3b2f2f;--soft:#8a7768;--card:#fff;--line:#ecdcbc;--go:#35b56a;--go-d:#23894d;--warn:#d9822b;--bad:#c9453c;--blue:#3d7fe0;
  --r:28px;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:active{transform:scale(.95)}
.top{display:flex;justify-content:space-between;align-items:center;min-height:64px}
.round{width:64px;height:64px;border-radius:50%;background:var(--card);box-shadow:0 3px 0 var(--line);font-size:32px;display:grid;place-items:center}
.gear{width:48px;height:48px;font-size:22px;opacity:.55}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
.logo{font-size:84px;line-height:1}
.kids{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
.kid{width:min(40vw,240px);aspect-ratio:1;border-radius:var(--r);box-shadow:0 8px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.kid .face{font-size:min(20vw,120px);line-height:1.1}
.kid .nm{font-size:22px;font-weight:700}
.big{font-size:min(34vw,200px);line-height:1}
.play{width:min(46vw,240px);aspect-ratio:1;border-radius:50%;background:var(--go);box-shadow:0 12px 0 var(--go-d);display:grid;place-items:center}
.play:active{box-shadow:0 4px 0 var(--go-d);transform:translateY(8px)}
.play svg{width:46%;margin-left:8%}
.dots{display:flex;gap:18px}
.dot{width:44px;height:44px;border-radius:50%;background:#e9dcc3;display:grid;place-items:center;font-size:26px;transition:.2s}
.dot.on{background:#ffd23f;transform:scale(1.2)}
.star{font-size:min(40vw,220px);line-height:1;margin:40px 0 56px;transition:transform .08s,filter .08s;filter:grayscale(.7) opacity(.6)}
.hint{font-size:18px;color:var(--soft);max-width:520px;line-height:1.6;-webkit-user-select:text;user-select:text}
.bounce{animation:b 1s infinite}@keyframes b{50%{transform:translateY(-14px)}}
.pop{animation:p .5s}@keyframes p{0%{transform:scale(.3)}70%{transform:scale(1.15)}}
/* 家長模式 */
.parent{max-width:720px;width:100%;margin:0 auto;-webkit-user-select:text;user-select:text}
.parent h1{font-size:26px;margin:0}
.parent h2{font-size:19px;margin:26px 0 10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--blue);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;font-size:17px}
.btn.ghost{background:#f1e7d0;color:var(--ink)}.btn.danger{background:var(--bad)}.btn.sm{padding:8px 12px;font-size:15px}
input[type=text]{font:inherit;font-size:19px;padding:12px;border:2px solid var(--line);border-radius:12px;width:100%;background:#fffdf7;-webkit-user-select:text;user-select:text}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.chk:last-child{border:0}
.chk .ic{font-size:22px;width:28px;text-align:center}.chk b{display:block}.chk small,.small{color:var(--soft);font-size:15px;line-height:1.5}
.pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.pick button{font-size:34px;aspect-ratio:1;border-radius:14px;background:#f6edd9;border:3px solid transparent}
.pick button.sel{border-color:var(--blue);background:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:10px 14px;border-radius:12px;background:#f1e7d0;font-size:17px;font-weight:600;min-width:48px}
.seg button.sel{background:var(--blue);color:#fff}
.krow{display:flex;align-items:center;gap:12px;padding:8px 0}.krow .f{font-size:38px;width:56px;height:56px;border-radius:14px;display:grid;place-items:center}.krow .n{flex:1;font-size:19px;font-weight:700}
.gate{font-size:44px;font-weight:800;letter-spacing:2px}
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:12px}
.pad button{height:72px;border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:30px;font-weight:700}
.banner{background:#fff1d6;border:2px solid var(--warn);border-radius:18px;padding:14px 16px;font-size:16px;line-height:1.6;text-align:left;max-width:560px;-webkit-user-select:text;user-select:text}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#3b2f2f;color:#fff;padding:12px 20px;border-radius:99px;font-size:16px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}

/* 練習流程 */
.bar{display:flex;align-items:center;gap:12px;min-height:64px}
.fruits{flex:1;display:flex;justify-content:center;gap:10px;font-size:34px}
.fruits span{filter:grayscale(1) opacity(.35);transition:.3s}.fruits span.done{filter:none}.fruits span.now{filter:none;transform:scale(1.35)}
.xs{width:48px;height:48px;font-size:22px;opacity:.5}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.huge{font-size:min(36vw,210px);line-height:1}
.mid2{font-size:min(18vw,96px);line-height:1}
.ok{width:120px;height:120px;border-radius:50%;background:var(--go);box-shadow:0 8px 0 var(--go-d);font-size:56px;display:grid;place-items:center}
.ok.small{width:84px;height:84px;font-size:38px;opacity:.85}
.neck{height:min(46vh,420px)}
.count{font-size:min(30vw,170px);font-weight:900;color:var(--warn);line-height:1}
.beats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:560px}
.beats i{width:34px;height:34px;border-radius:50%;background:#e9dcc3;transition:.1s}.beats i.on{background:var(--warn);transform:scale(1.25)}.beats i.hit{background:var(--go)}
.jump{animation:j .32s}@keyframes j{40%{transform:translateY(-34px) scale(1.08)}}
.stars3{font-size:72px;letter-spacing:6px}
.stickers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.stickers button{font-size:72px;width:120px;height:120px;border-radius:26px;background:var(--card);box-shadow:0 6px 0 var(--line)}
.week{display:flex;gap:10px;justify-content:center}
.week div{width:58px;height:58px;border-radius:16px;background:#f1e7d0;display:grid;place-items:center;font-size:34px}
.week div.today{outline:4px solid var(--warn)}
.isles{display:flex;gap:14px;justify-content:center;font-size:44px}
.isles span{width:72px;height:72px;border-radius:50%;background:#f1e7d0;display:grid;place-items:center;filter:grayscale(1) opacity(.4)}
.isles span.open{filter:none;background:#fff}.isles span.cur{filter:none;background:#ffe08a;outline:4px solid var(--warn);transform:scale(1.12)}
.rate{border-top:2px dashed var(--line);padding-top:14px;margin-top:6px}
.rate .row{justify-content:center}
.rate button{padding:12px 16px;border-radius:14px;background:#f1e7d0;font-size:24px}.rate button.sel{background:#ffd23f}
.meter{height:22px;border-radius:11px;background:#f1e7d0;overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;width:0;background:var(--go);transition:width .06s}
.tuner{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tuner button{padding:14px 4px;border-radius:16px;color:#fff;font-weight:800;font-size:20px}.tuner button small{display:block;font-size:28px}
.needle{position:relative;height:56px;background:#f6edd9;border-radius:14px;margin:14px 0}
.needle::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--go)}
.needle i{position:absolute;top:6px;bottom:6px;width:10px;margin-left:-5px;border-radius:5px;background:var(--ink);left:50%;transition:left .08s}
.tread{font-size:26px;font-weight:800;min-height:38px}

.rds{display:flex;justify-content:center;gap:10px;min-height:22px;margin-top:4px}
.rds i{width:20px;height:20px;border-radius:50%;background:#e9dcc3;border:3px solid #d8c7a4}.rds i.done{background:var(--go);border-color:var(--go-d)}.rds i.now{background:#ffd23f;border-color:var(--warn);transform:scale(1.25)}
.fruits span.maybe{filter:grayscale(1) opacity(.18)}
.choice{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.choice button{width:min(26vw,170px);aspect-ratio:1;border-radius:var(--r);background:var(--card);box-shadow:0 8px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.choice button span{font-size:min(14vw,88px);line-height:1.1}.choice button small{font-size:17px;color:var(--soft);font-weight:700}
.plan{display:flex;gap:18px;font-size:min(12vw,76px)}.plan span{filter:grayscale(1) opacity(.3);transition:.3s}.plan span.on{filter:none;transform:scale(1.15)}
.seq{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:48px;align-items:center}
.seq>span{opacity:.45;transition:.15s}.seq>span.now{opacity:1;transform:scale(1.3)}.seq>span.done{opacity:1}
.num{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;font-size:32px;font-weight:900;border:3px solid #fff;box-shadow:0 2px 0 var(--line)}
.num.big{width:130px;height:130px;font-size:80px}.num.done{outline:5px solid var(--go)}.num.now{outline:5px solid var(--warn)}
.strip{display:flex;gap:10px;font-size:44px;background:var(--card);border-radius:18px;padding:8px 16px;box-shadow:0 3px 0 var(--line)}
.beats i.app{border-radius:8px;background:#d9e8ff}
.neck{height:min(40vh,380px)}
select{font:inherit;font-size:17px;padding:10px;border-radius:12px;border:2px solid var(--line);background:#fffdf7}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script src="pitch.js"></script>
<script src="app.js"></script>

</body>
</html>
